name: e2e

# The full live scenario (CLAUDE §6: the functional contract): builds images and runs a real worker
# executing OpenTofu (~minutes). It runs on every pull request — make the `e2e` check required in
# the branch protection of main — on main, on demand, and from release.yml before any image is
# published.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A new push to a PR cancels its running scenario. Under workflow_call, github.workflow is the
# caller's name: the group stays distinct from the caller's own.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f deploy/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v6

      - name: Generate .env + dev keys
        run: bash scripts/bootstrap-env.sh

      # Every tracked plan is stored (encrypted) in S3 for its apply, so e2e needs a provisioned
      # Garage: layout, access key (written into .env), bucket. Same script as `task dev`; it runs
      # before the API container exists, since compose reads .env when it creates it.
      - name: Provision dev S3 (Garage)
        run: bash scripts/bootstrap-s3.sh

      # Only the services e2e needs: Postgres + Garage + API + worker (no front). Builds the
      # api/worker images.
      - name: Bring up the stack
        run: $COMPOSE up -d --wait postgres garage api worker

      - name: Migrate
        run: $COMPOSE exec -T api uv run alembic upgrade head

      - name: Seed fixture repos (host git)
        run: bash scripts/seed-fixtures.sh

      - name: Seed demo graph + worker pool token
        run: $COMPOSE exec -T api uv run python -m app.seed

      - name: Run the e2e scenario
        run: $COMPOSE exec -T api uv run pytest e2e -v

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
